name: Set up vcpkg

description: >
  Points VCPKG_ROOT at the runner's preinstalled vcpkg, checks it out to
  this repo's pinned baseline, and restores a binary cache keyed on that
  baseline plus the toolchain, so CI doesn't rebuild every dependency from
  source on each run. Linux only - trimmed from the fork's original
  cross-platform action (removed in c630200d9) to what 4.4 needs.

inputs:
  name_os:
    description: "Name of the OS, used in the cache key"
    required: true

  arch:
    description: "Architecture, used in the cache key"
    required: true

  compiler:
    description: "Compiler, used in the cache key"
    required: false
    default: ""

  compiler_version:
    description: "Compiler version, used in the cache key"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set vcpkg env variables
      shell: bash
      run: |
        echo "VCPKG_ROOT=${VCPKG_INSTALLATION_ROOT}" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg_bin_cache" >> "$GITHUB_ENV"
        echo "DOSBOX_VCPKG_BASELINE=$(jq -r .\"builtin-baseline\" ./vcpkg.json)" >> "$GITHUB_ENV"

    - name: Checkout vcpkg to baseline
      shell: bash
      run: |
        cd "${VCPKG_ROOT}"
        git reset --hard
        git fetch
        git checkout "$DOSBOX_VCPKG_BASELINE"

    - name: Get vcpkg commit
      shell: bash
      run: |
        cd "${VCPKG_ROOT}"
        echo "VCPKG_SHORT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

    - name: Set vcpkg binary cache key
      id: vcpkg_bin_cache_key
      shell: bash
      run: |
        if [ -n "${{ inputs.compiler }}" ]; then INPUTS_COMPILER="${{ inputs.compiler }}-"; fi
        if [ -n "${{ inputs.compiler_version }}" ]; then INPUTS_COMPILER_VERSION="${{ inputs.compiler_version }}-"; fi
        echo "cacheKey=vcpkg-${VCPKG_SHORT_HASH}-bin-cache-${{ inputs.name_os }}-${{ inputs.arch }}-${INPUTS_COMPILER}${INPUTS_COMPILER_VERSION}${ImageOS}-${ImageVersion}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}" >> "$GITHUB_OUTPUT"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      id: vcpkg_bin_cache
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ steps.vcpkg_bin_cache_key.outputs.cacheKey }}

    - name: Create binary cache directory
      if: ${{ steps.vcpkg_bin_cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

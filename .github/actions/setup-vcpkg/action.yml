name: Set up vcpkg

description: >
  Checks out and bootstraps this repository's pinned vcpkg baseline in
  the job workspace and restores a binary cache keyed on the baseline,
  manifest, triplets, and runner toolchain. Supports Linux, macOS, and Windows.

inputs:
  name_os:
    description: "Name of the OS, used in the cache key"
    required: true

  arch:
    description: "Architecture, used in the cache key"
    required: true

  compiler:
    description: "Compiler, used in the cache key"
    required: false
    default: ""

  compiler_version:
    description: "Compiler version, used in the cache key"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set vcpkg env variables
      shell: bash
      run: |
        echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/.ci/vcpkg" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}/vcpkg_bin_cache" >> "$GITHUB_ENV"
        echo "DOSBOX_VCPKG_BASELINE=$(jq -r .\"builtin-baseline\" ./vcpkg.json)" >> "$GITHUB_ENV"

    - name: Check out pinned vcpkg
      uses: actions/checkout@v7
      with:
        repository: microsoft/vcpkg
        ref: ${{ env.DOSBOX_VCPKG_BASELINE }}
        path: .ci/vcpkg
        persist-credentials: false

    - name: Bootstrap vcpkg (POSIX)
      if: runner.os != 'Windows'
      shell: bash
      run: '"${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics'

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: '& "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics'

    - name: Get vcpkg commit
      shell: bash
      run: |
        cd "${VCPKG_ROOT}"
        echo "VCPKG_SHORT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

    - name: Set vcpkg binary cache key
      id: vcpkg_bin_cache_key
      shell: bash
      run: |
        if [ -n "${{ inputs.compiler }}" ]; then INPUTS_COMPILER="${{ inputs.compiler }}-"; fi
        if [ -n "${{ inputs.compiler_version }}" ]; then INPUTS_COMPILER_VERSION="${{ inputs.compiler_version }}-"; fi
        echo "cacheKey=vcpkg-${VCPKG_SHORT_HASH}-bin-cache-${{ inputs.name_os }}-${{ inputs.arch }}-${INPUTS_COMPILER}${INPUTS_COMPILER_VERSION}${ImageOS}-${ImageVersion}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-triplets/**') }}" >> "$GITHUB_OUTPUT"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      id: vcpkg_bin_cache
      with:
        path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
        key: ${{ steps.vcpkg_bin_cache_key.outputs.cacheKey }}

    - name: Create binary cache directory
      if: ${{ steps.vcpkg_bin_cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"

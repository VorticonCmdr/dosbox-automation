name: CI

permissions: read-all

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'licenses/**'
      - 'website/**'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'licenses/**'
      - 'website/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: ${{ matrix.conf.name }}
    runs-on: ${{ matrix.conf.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        conf:
          - name: Debug build, GCC
            os: ubuntu-24.04
            name_os: linux
            cmake_preset: debug-linux-vcpkg
            cmake_flags: ""
            max_warnings: 0
          - name: Debugger build, GCC
            os: ubuntu-24.04
            name_os: linux
            cmake_preset: debug-linux-vcpkg
            cmake_flags: "-DOPT_DEBUGGER=ON"
            max_warnings: 0
          - name: Heavy debugger build, GCC
            os: ubuntu-24.04
            name_os: linux
            cmake_preset: debug-linux-heavy-vcpkg
            cmake_flags: ""
            max_warnings: 0
          - name: Debug build, macOS
            os: macos-15
            name_os: macos
            cmake_preset: debug-macos
            cmake_flags: ""
            max_warnings: 0
          - name: Debug build, Windows
            os: windows-2025
            name_os: windows
            cmake_preset: debug-windows-vs2022
            cmake_flags: ""
            max_warnings: 0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Set up CMake
        uses: lukka/get-cmake@v4.4.2

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt-get update
          sudo apt-get install -y $(cat extras/linux/ubuntu-24.04-packages.txt)

      - name: Set up vcpkg
        uses: ./.github/actions/setup-vcpkg
        with:
          name_os: ${{ matrix.conf.name_os }}
          arch: ${{ runner.arch }}
          compiler: ${{ runner.os }}-default

      - name: Configure
        run: cmake ${{ matrix.conf.cmake_flags }} --preset ${{ matrix.conf.cmake_preset }}

      - name: Build
        run: |
          set -o pipefail
          cmake --build --preset ${{ matrix.conf.cmake_preset }} --parallel 4 2>&1 | tee build.log

      - name: Run tests
        run: ctest -j 4 --preset ${{ matrix.conf.cmake_preset }} --output-on-failure --no-tests=error

      - name: Summarize warnings
        env:
          MAX_WARNINGS: ${{ matrix.conf.max_warnings }}
        run: ./scripts/ci/count-warnings.py -lf build.log

      - name: Set up Python
        if: runner.os == 'Linux'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Select live engine binary
        if: runner.os == 'Linux'
        run: |
          case '${{ matrix.conf.name }}' in
            'Debug build, GCC') engine="$GITHUB_WORKSPACE/build/debug-linux/dosbox" ;;
            'Debugger build, GCC') engine="$GITHUB_WORKSPACE/build/debug-linux/dosbox_with_debugger" ;;
            'Heavy debugger build, GCC') engine="$GITHUB_WORKSPACE/build/debug-linux-heavy/dosbox_with_debugger" ;;
          esac
          test -x "$engine"
          echo "DOSBOX_BIN=$engine" >> "$GITHUB_ENV"

      - name: Run live HTTP integration tests
        if: runner.os == 'Linux'
        run: |
          python -m pip install -r tests/integration/requirements.txt
          python -m pytest -q --tb=short \
            tests/integration/test_api_contract.py \
            tests/integration/test_webserver_require_auth.py \
            tests/integration/test_token_provisioning.py \
            tests/integration/test_mount_policy.py \
            tests/integration/test_traversal_contract.py \
            tests/integration/test_openapi_docs.py \
            tests/integration/test_lua_api.py \
            tests/integration/test_lua_functions.py \
            tests/integration/test_capture_api.py

      - name: Check out compatible MCP bridge
        if: matrix.conf.name == 'Heavy debugger build, GCC'
        uses: actions/checkout@v7
        with:
          repository: VorticonCmdr/dosbox-mcp
          # Pin the tested bridge revision so engine CI is reproducible.
          ref: 026ab7259440a1e18a29aa2a2111d3d2d7dab6b7
          path: .ci/dosbox-mcp
          persist-credentials: false

      - name: Run live MCP bridge smoke tests
        if: matrix.conf.name == 'Heavy debugger build, GCC'
        run: |
          python -m pip install -e './.ci/dosbox-mcp[dev]'
          python -m pytest -q --tb=short .ci/dosbox-mcp/tests/test_live_engine.py

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: false

      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format

      - name: Verify formatting of touched lines
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            base=$(git merge-base "$PR_BASE_SHA" HEAD)
          elif [[ -n "$PUSH_BEFORE_SHA" && ! "$PUSH_BEFORE_SHA" =~ ^0+$ ]] && git cat-file -e "$PUSH_BEFORE_SHA^{commit}"; then
            base="$PUSH_BEFORE_SHA"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            base=HEAD^
          else
            base=$(git hash-object -t tree /dev/null)
          fi
          ./scripts/tools/format-commit.sh --diff "$base"
